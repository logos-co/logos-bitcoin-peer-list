[package]
name = "kyoto-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Starts Kyoto against the curated peer list (whitelist_only, 8 random onion peers, Tor) and times each start to the tip."

[dependencies]
# bip157 0.7.0 is untagged; the plan pins the commit it was published from.
bip157 = { git = "https://github.com/2140-dev/kyoto", rev = "0169dc3514c8238147302535a1123d5c37468de6" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha3 = "0.10"
