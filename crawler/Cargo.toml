[package]
name = "peer-list"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Curates onion peers that serve BIP157 compact filters, over Tor, into a signed list for Kyoto."

[dependencies]
bitcoin = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
sha2 = "0.10"
sha3 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
